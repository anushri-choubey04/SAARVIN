{% extends 'base.html' %}
{% load static %}

{% block title %}Register - SAARVIN RENT{% endblock %}

{% block content %}
<div class="register-container">
    <div class="register-form">
        <h2>Create Account</h2>
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <input type="text" name="username" placeholder="Username" required>
            </div>
            <div class="form-group">
                <input type="email" name="email" placeholder="Email" required>
            </div>
            <div class="form-group">
                <input type="text" name="first_name" placeholder="First Name">
            </div>
            <div class="form-group">
                <input type="text" name="last_name" placeholder="Last Name">
            </div>
            <div class="form-group">
                <input type="tel" name="phone" placeholder="Phone Number">
            </div>
            <div class="form-group">
                <input type="password" name="password1" placeholder="Password" required>
            </div>
            <div class="form-group">
                <input type="password" name="password2" placeholder="Confirm Password" required>
            </div>
            <button type="submit" class="register-btn">Register</button>
        </form>
        <p class="login-link">Already have an account? <a href="{% url 'login' %}">Login here</a></p>
    </div>
</div>

<style>
.register-container {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 80vh;
    padding: 20px;
}

.register-form {
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 10px;
    padding: 40px;
    width: 100%;
    max-width: 400px;
    box-shadow: 5px 20px 50px rgba(0, 0, 0, 0.5);
}

.register-form h2 {
    color: #fff;
    text-align: center;
    margin-bottom: 30px;
    font-size: 2.3em;
}

.form-group {
    margin-bottom: 20px;
}

.form-group input {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 5px;
    background: #e0dede;
    font-size: 1em;
    outline: none;
}

.register-btn {
    width: 100%;
    padding: 12px;
    background: #080214;
    color: #fff;
    border: none;
    border-radius: 5px;
    font-size: 1em;
    font-weight: bold;
    cursor: pointer;
    margin-top: 20px;
}

.register-btn:hover {
    background: #1a0a2e;
}

.login-link {
    text-align: center;
    margin-top: 20px;
    color: #fff;
}

.login-link a {
    color: #0077ff;
    text-decoration: none;
}

.login-link a:hover {
    text-decoration: underline;
}
</style>
{% endblock %}
