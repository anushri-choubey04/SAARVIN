<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sleek Auth UI</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet"/>
  <style>
    * {
      margin: 0; padding: 0; box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    body {
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg,#4facfe,#00f2fe);
    }

    .overlay {
      position: fixed; inset: 0;
      display: flex; justify-content: center; align-items: center;
      backdrop-filter: blur(10px);
      background: rgba(0,0,0,0.3);
      z-index: 5;
    }

    .auth-card {
      position: relative;
      width: 400px; max-width: 90%;
      background: rgba(255,255,255,0.15);
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.4);
      overflow: hidden;
    }

    .auth-card h2 {
      text-align: center;
      color: #fff;
      font-weight: 600;
      margin-bottom: 25px;
    }

    .input-box {
      position: relative;
      margin-bottom: 18px;
    }

    .input-box input {
      width: 100%;
      padding: 12px 40px 12px 15px;
      border: none;
      border-radius: 10px;
      background: rgba(255,255,255,0.2);
      color: #fff;
      font-size: 15px;
      outline: none;
    }

    .input-box input::placeholder {
      color: rgba(255,255,255,0.7);
    }

    .input-box i {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: #fff;
      opacity: 0.7;
    }

    .btn {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      background: linear-gradient(135deg,#667eea,#764ba2);
      color: #fff;
      transition: all 0.3s ease;
    }

    .btn:hover {
      transform: scale(1.03);
      background: linear-gradient(135deg,#764ba2,#667eea);
    }

    .switch {
      text-align: center;
      margin-top: 15px;
      color: #eee;
      font-size: 14px;
    }

    .switch a {
      color: #fff;
      font-weight: 600;
      text-decoration: none;
    }

    /* Close Button */
    .close-btn {
      position: absolute;
      top: 12px; right: 15px;
      font-size: 22px;
      color: #fff;
      cursor: pointer;
      font-weight: bold;
      transition: 0.3s;
    }

    .close-btn:hover {
      color: #ff4d4d;
    }

    /* Message Alerts */
    .messages {
      margin-bottom: 15px;
    }
    .alert {
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 10px;
      font-size: 13px;
      text-align: center;
    }
    .alert-success { background: #d4edda; color:#155724; }
    .alert-error { background: #f8d7da; color:#721c24; }
  </style>
  <script src="https://kit.fontawesome.com/3d3d3d3.js" crossorigin="anonymous"></script>
</head>
<body>
  <div class="overlay">
    <div class="auth-card">
      <!-- Close -->
      <div class="close-btn" onclick="goBack()">✖</div>

      <!-- Messages -->
      {% if messages %}
      <div class="messages">
        {% for message in messages %}
        <div class="alert alert-{{ message.tags }}">{{ message }}</div>
        {% endfor %}
      </div>
      {% endif %}

      <!-- Login -->
      <div id="login-form">
        <h2>Welcome Back</h2>
        <form method="POST" action="{% url 'login' %}">
          {% csrf_token %}
          <div class="input-box">
            <input type="text" name="username" placeholder="Username or Email" required>
            <i class="fas fa-user"></i>
          </div>
          <div class="input-box">
            <input type="password" name="password" placeholder="Password" required>
            <i class="fas fa-lock"></i>
          </div>
          <button class="btn" type="submit">Login</button>
        </form>
        <div class="switch">Don't have an account? <a href="#" onclick="toggleForm()">Sign Up</a></div>
      </div>

      <!-- Signup -->
      <div id="signup-form" style="display:none;">
        <h2>Create Account</h2>
        <form method="POST" action="{% url 'register' %}">
          {% csrf_token %}
          <div class="input-box">
            <input type="text" name="username" placeholder="Username" required>
            <i class="fas fa-user"></i>
          </div>
          <div class="input-box">
            <input type="email" name="email" placeholder="Email" required>
            <i class="fas fa-envelope"></i>
          </div>
          <div class="input-box">
            <input type="text" name="phone" placeholder="Phone number" required>
            <i class="fas fa-phone"></i>
          </div>
          <div class="input-box">
            <input type="password" name="password1" placeholder="Password" required>
            <i class="fas fa-lock"></i>
          </div>
          <div class="input-box">
            <input type="password" name="password2" placeholder="Confirm Password" required>
            <i class="fas fa-lock"></i>
          </div>
          <button class="btn" type="submit">Sign Up</button>
        </form>
        <div class="switch">Already have an account? <a href="#" onclick="toggleForm()">Login</a></div>
      </div>
    </div>
  </div>

  <script>
    function goBack(){ window.history.back(); }
    function toggleForm(){
      let login = document.getElementById("login-form");
      let signup = document.getElementById("signup-form");
      if(login.style.display==="none"){
        login.style.display="block";
        signup.style.display="none";
      } else {
        login.style.display="none";
        signup.style.display="block";
      }
    }
  </script>
</body>
</html>
